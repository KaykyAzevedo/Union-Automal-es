# Dispara MANUALMENTE a verificação diária do app na Vercel (/cron/daily).
# O agendamento normal é o Vercel Cron do vercel.json (todo dia 18:00 BRT); este
# workflow serve para rodar na hora: Actions > Poll estoque > Run workflow.
#
# Configurar em GitHub > Settings > Secrets and variables > Actions > New repository secret:
#   APP_URL      endereço do app, ex.: https://union-automal-es.vercel.app
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET na Vercel
name: Poll estoque

on:
  workflow_dispatch:

concurrency:
  group: poll-estoque
  cancel-in-progress: false

permissions: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /cron/daily
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure os secrets APP_URL e CRON_SECRET do repositório."
            exit 1
          fi
          url="${APP_URL%/}/cron/daily"
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 15 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" "$url") || status=000
          echo "HTTP $status"
          cat response.json 2>/dev/null || true
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::/cron/daily respondeu HTTP $status"
            exit 1
          fi
